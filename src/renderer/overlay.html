<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soulleak mini-player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    /* A compact obsidian pill: grip, cover art with the song, previous / play / next, volume. */
    .pill {
      position: absolute;
      inset: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px 0 6px;
      border-radius: 18px;
      background: #0b0a10;
      border: 1px solid rgba(139, 92, 246, 0.35);
      /* The window is only 6 px bigger than the pill on each side: a bigger shadow, or a backdrop blur (useless on
         an opaque pill), gets cut off at the window edge and shows as a grey box around the player. */
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      color: #fff;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .pill:hover { border-color: rgba(139, 92, 246, 0.7); }

    /* The cover's colors bleed softly into the pill. */
    .pill-bg {
      position: absolute;
      inset: -20%;
      background-size: cover;
      background-position: center;
      filter: blur(26px) saturate(1.4);
      opacity: 0.22;
      pointer-events: none;
      transition: background-image 0.6s ease;
    }

    .pill > *:not(.pill-bg) { position: relative; }

    /* Drag handle; dropping the window snaps it to the nearest screen corner. */
    .grip {
      display: grid;
      place-items: center;
      width: 14px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.3);
      cursor: grab;
    }

    .grip svg { width: 8px; height: 18px; fill: currentColor; }

    .art {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      overflow: hidden;
      border-radius: 10px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art img:not([src]), .art img[src=""] { visibility: hidden; }

    .meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      margin: 0 4px 0 4px;
    }

    .title, .artist {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title { font-size: 12.5px; font-weight: 700; }
    .artist { font-size: 11px; color: rgba(255, 255, 255, 0.55); }

    button {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.2s ease;
    }

    button:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    button:active { transform: scale(0.9); }
    button svg { width: 16px; height: 16px; fill: currentColor; }

    .play {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
    }

    .play:hover { background: linear-gradient(135deg, #9d74f8, #7c7ff3); }
    .play svg { width: 18px; height: 18px; }
    .play .i-pause { display: none; }
    body.playing .play .i-pause { display: block; }
    body.playing .play .i-play { display: none; }

    .vol {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 2px;
      color: rgba(255, 255, 255, 0.6);
    }

    .vol svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 50px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #8b5cf6 var(--v, 50%), rgba(255, 255, 255, 0.18) var(--v, 50%));
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.35);
    }

    /* Repeat this song: glows when on. */
    .repeat { width: 30px; height: 30px; color: rgba(255, 255, 255, 0.55); }
    .repeat svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    body.repeat-on .repeat {
      color: #fff;
      background: rgba(139, 92, 246, 0.28);
      box-shadow: inset 0 0 0 1px rgba(139, 92, 246, 0.8), 0 0 12px rgba(139, 92, 246, 0.6);
    }

    /* Seek bar along the bottom edge: a thin line that thickens on hover; click or drag to jump. */
    .seek {
      position: absolute !important;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 12px;
      cursor: pointer;
    }

    .seek-rail {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      transition: height 0.15s ease;
    }

    .seek-rail i {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #a78bfa, #8b5cf6, #6366f1);
      transform-origin: left center;
      transform: scaleX(0);
    }

    .seek-knob {
      position: absolute;
      bottom: 1.5px;
      left: 0;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.4), 0 0 10px rgba(139, 92, 246, 0.9);
      transform: scale(0);
      transition: transform 0.15s ease;
    }

    .seek:hover .seek-rail, body.seeking .seek-rail { height: 5px; }
    .seek:hover .seek-knob, body.seeking .seek-knob { transform: scale(1); }

    /* Time readout: shows the hovered or dragged position. */
    .seek-time {
      position: absolute;
      bottom: 13px;
      left: 0;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(10, 9, 15, 0.95);
      border: 1px solid rgba(139, 92, 246, 0.45);
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }

    .seek:hover .seek-time, body.seeking .seek-time { opacity: 1; }

    /* Presets: the button glows while a preset other than Default is on. */
    .presets { width: 30px; height: 30px; color: rgba(255, 255, 255, 0.55); }
    .presets svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
    body.preset-on .presets, body.menu-open .presets {
      color: #fff;
      background: rgba(139, 92, 246, 0.28);
      box-shadow: inset 0 0 0 1px rgba(139, 92, 246, 0.8), 0 0 12px rgba(139, 92, 246, 0.6);
    }

    /* While the list is open the window is taller: the pill keeps its size at the corner side, the list fills
       the rest. */
    body.menu-open .pill { inset: auto 6px auto 6px; height: 64px; }
    body.menu-open.menu-down .pill { top: 6px; }
    body.menu-open.menu-up .pill { bottom: 6px; }
    .menu {
      position: absolute;
      left: 6px;
      right: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 6px;
      border-radius: 14px;
      background: #0b0a10;
      border: 1px solid rgba(139, 92, 246, 0.45);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      overflow-y: auto;
      color: #fff;
    }
    body.menu-open .menu { display: flex; }
    body.menu-down .menu { top: 74px; bottom: 6px; }
    body.menu-up .menu { top: 6px; bottom: 74px; }
    .menu::-webkit-scrollbar { width: 4px; }
    .menu::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.5); border-radius: 2px; }
    .menu-head { padding: 2px 8px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255, 255, 255, 0.45); }
    .menu button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 30px;
      padding: 0 10px;
      border-radius: 9px;
      font: inherit;
      font-size: 12.5px;
      text-align: left;
      color: rgba(255, 255, 255, 0.85);
    }
    .menu button:active { transform: none; }
    .menu button.active { color: #fff; background: rgba(139, 92, 246, 0.25); }
    .menu button.active::after { content: '✓'; font-size: 12px; color: #a78bfa; }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="pill-bg" id="pill-bg"></div>
    <div class="grip" title="Drag; it snaps to the nearest corner">
      <svg viewBox="0 0 8 18"><circle cx="2" cy="3" r="1.5"/><circle cx="6.5" cy="3" r="1.5"/><circle cx="2" cy="9" r="1.5"/><circle cx="6.5" cy="9" r="1.5"/><circle cx="2" cy="15" r="1.5"/><circle cx="6.5" cy="15" r="1.5"/></svg>
    </div>
    <div class="art"><img id="art" alt="" draggable="false"></div>
    <div class="meta">
      <span class="title" id="title">Nothing playing</span>
      <span class="artist" id="artist">Soulleak</span>
    </div>
    <button type="button" class="presets" id="presets-btn" title="Presets" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
    </button>
    <button type="button" data-cmd="prev" title="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 6.2v11.6a1 1 0 0 1-1.55.83L10 13a1.2 1.2 0 0 1 0-2l8.45-5.63A1 1 0 0 1 20 6.2Z"/></svg>
    </button>
    <button type="button" class="play" data-cmd="play-pause" title="Play / pause">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <button type="button" data-cmd="next" title="Skip">
      <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 6.2v11.6a1 1 0 0 0 1.55.83L14 13a1.2 1.2 0 0 0 0-2L5.55 5.37A1 1 0 0 0 4 6.2Z"/></svg>
    </button>
    <button type="button" class="repeat" data-cmd="toggle-repeat" title="Repeat this song" aria-pressed="false">
      <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
    <div class="vol">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="50" aria-label="Volume">
    </div>
    <div class="seek" id="seek" role="slider" aria-label="Seek" tabindex="0">
      <div class="seek-rail"><i id="seek-fill"></i></div>
      <span class="seek-knob" id="seek-knob"></span>
      <span class="seek-time" id="seek-time">0:00</span>
    </div>
  </div>
  <div class="menu" id="menu" role="menu"></div>

  <script>
    const api = window.soulOverlay;
    const vol = document.getElementById('vol');
    const seek = document.getElementById('seek');
    const seekFill = document.getElementById('seek-fill');
    const seekKnob = document.getElementById('seek-knob');
    const seekTime = document.getElementById('seek-time');
    const repeatBtn = document.querySelector('.repeat');
    const pill = document.getElementById('pill');
    const art = document.getElementById('art');
    const pillBg = document.getElementById('pill-bg');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    let dragging = false;
    let lastArt = null;

    function paintVolume() {
      vol.style.setProperty('--v', `${vol.value}%`);
    }

    // Hold the grip to move the player; on release it snaps to the nearest screen corner.
    const grip = document.querySelector('.grip');
    grip.addEventListener('pointerdown', (e) => {
      grip.setPointerCapture(e.pointerId);
      grip.style.cursor = 'grabbing';
      if (api) api.dragStart();
    });
    const endDrag = () => {
      grip.style.cursor = '';
      if (api) api.dragEnd();
    };
    grip.addEventListener('pointerup', endDrag);
    grip.addEventListener('lostpointercapture', endDrag);

    document.querySelectorAll('[data-cmd]').forEach((btn) => {
      btn.addEventListener('click', () => api && api.command(btn.dataset.cmd));
    });

    vol.addEventListener('pointerdown', () => { dragging = true; });
    window.addEventListener('pointerup', () => { dragging = false; });
    vol.addEventListener('input', () => {
      paintVolume();
      if (api) api.command('set-volume', Number(vol.value) / 100);
    });

    // Scrolling over the pill also changes the volume.
    pill.addEventListener('wheel', (e) => {
      vol.value = Math.max(0, Math.min(100, Number(vol.value) + (e.deltaY < 0 ? 5 : -5)));
      paintVolume();
      if (api) api.command('set-volume', Number(vol.value) / 100);
    }, { passive: true });

    art.addEventListener('error', () => art.removeAttribute('src'));

    // Playback position: the app reports it twice a second, so between reports it's moved forward locally.
    const fmt = (sec) => {
      const t = Math.max(0, Math.floor(sec || 0));
      return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
    };
    let pos = 0;
    let dur = 0;
    let isPlaying = false;
    let reportedAt = performance.now();
    let seekingTo = null;

    const fracFromX = (x) => {
      const r = seek.getBoundingClientRect();
      return r.width ? Math.max(0, Math.min(1, (x - r.left) / r.width)) : 0;
    };

    function paintSeek(frac) {
      seekFill.style.transform = `scaleX(${frac})`;
      seekKnob.style.left = `${frac * 100}%`;
    }

    (function tick() {
      if (seekingTo === null) {
        const live = isPlaying ? pos + (performance.now() - reportedAt) / 1000 : pos;
        paintSeek(dur ? Math.min(1, live / dur) : 0);
      }
      requestAnimationFrame(tick);
    })();

    seek.addEventListener('pointermove', (e) => {
      const f = fracFromX(e.clientX);
      seekTime.textContent = fmt(f * dur);
      seekTime.style.left = `${f * 100}%`;
      if (seekingTo !== null) {
        seekingTo = f;
        paintSeek(f);
      }
    });
    seek.addEventListener('pointerdown', (e) => {
      if (!dur) return;
      seek.setPointerCapture(e.pointerId);
      document.body.classList.add('seeking');
      seekingTo = fracFromX(e.clientX);
      paintSeek(seekingTo);
    });
    const finishSeek = () => {
      if (seekingTo === null) return;
      const target = seekingTo * dur;
      seekingTo = null;
      document.body.classList.remove('seeking');
      pos = target;
      reportedAt = performance.now();
      if (api) api.command('seek', target);
    };
    seek.addEventListener('pointerup', finishSeek);
    seek.addEventListener('lostpointercapture', finishSeek);
    seek.addEventListener('keydown', (e) => {
      if (!dur || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      pos = Math.max(0, Math.min(dur - 0.5, pos + (e.key === 'ArrowRight' ? 5 : -5)));
      reportedAt = performance.now();
      if (api) api.command('seek', pos);
    });

    // ---- Presets list ----
    const presetsBtn = document.getElementById('presets-btn');
    const menu = document.getElementById('menu');
    let presets = [];
    let activePreset = 'p_default';
    const ROW = 32;
    function renderMenu() {
      menu.innerHTML = '<div class="menu-head">Presets</div>' + presets.map((p) =>
        '<button type="button" role="menuitem" data-id="' + p.id.replace(/"/g, '') + '" class="' + (p.id === activePreset ? 'active' : '') + '"></button>').join('');
      // Names go in as text, never as HTML.
      menu.querySelectorAll('button').forEach((b, i) => { b.textContent = presets[i].name; });
    }
    function openMenu() {
      if (!api || !presets.length) return;
      renderMenu();
      const extra = Math.min(6, presets.length) * ROW + 40;
      document.body.classList.add('menu-open');
      presetsBtn.setAttribute('aria-expanded', 'true');
      api.menu(extra);
    }
    function closeMenu() {
      if (!document.body.classList.contains('menu-open')) return;
      document.body.classList.remove('menu-open', 'menu-up', 'menu-down');
      presetsBtn.setAttribute('aria-expanded', 'false');
      if (api) api.menu(0);
    }
    presetsBtn.addEventListener('click', () => {
      if (document.body.classList.contains('menu-open')) closeMenu(); else openMenu();
    });
    menu.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-id]');
      if (!b || !api) return;
      api.command('apply-preset', b.dataset.id);
      activePreset = b.dataset.id === activePreset && b.dataset.id !== 'p_default' ? 'p_default' : b.dataset.id;
      closeMenu();
    });
    // Back to the game (or anywhere else) closes the list.
    window.addEventListener('blur', closeMenu);
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
    grip.addEventListener('pointerdown', closeMenu, true);
    if (api && api.onMenuPlaced) {
      api.onMenuPlaced((side) => {
        if (side === 'closed') { document.body.classList.remove('menu-open', 'menu-up', 'menu-down'); presetsBtn.setAttribute('aria-expanded', 'false'); return; }
        if (!document.body.classList.contains('menu-open')) return;
        document.body.classList.toggle('menu-up', side === 'up');
        document.body.classList.toggle('menu-down', side !== 'up');
      });
    }

    if (api) {
      api.onState((s) => {
        if (!s) return;
        if (Array.isArray(s.presets)) {
          presets = s.presets;
          activePreset = s.activePreset || 'p_default';
          document.body.classList.toggle('preset-on', activePreset !== 'p_default');
          presetsBtn.title = 'Presets: ' + ((presets.find((p) => p.id === activePreset) || {}).name || 'Default');
          if (document.body.classList.contains('menu-open')) renderMenu();
        }
        document.body.classList.toggle('playing', !!s.playing);
        document.body.classList.toggle('repeat-on', !!s.repeat);
        repeatBtn.setAttribute('aria-pressed', s.repeat ? 'true' : 'false');
        isPlaying = !!s.playing;
        dur = Number(s.duration) || 0;
        pos = Number(s.position) || 0;
        reportedAt = performance.now();
        seek.setAttribute('aria-valuetext', `${fmt(pos)} of ${fmt(dur)}`);
        titleEl.textContent = s.title || 'Nothing playing';
        artistEl.textContent = s.artist || 'Soulleak';
        pill.title = s.title ? `${s.title}${s.artist ? ' · ' + s.artist : ''}` : '';
        if (s.art !== lastArt) {
          lastArt = s.art;
          if (s.art) {
            art.src = s.art;
            pillBg.style.backgroundImage = `url("${String(s.art).replace(/"/g, '%22')}")`;
          } else {
            art.removeAttribute('src');
            pillBg.style.backgroundImage = '';
          }
        }
        if (!dragging && Number.isFinite(s.volume)) {
          vol.value = Math.round(s.volume * 100);
          paintVolume();
        }
      });
    }
    paintVolume();
  </script>
</body>
</html>
